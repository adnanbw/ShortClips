name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Everything the collected tests import at module level, WITHOUT the
      # heavy ML stack (torch/ultralytics/mediapipe/faster-whisper) — the
      # pipeline modules import those lazily behind their feature gates, and
      # the tests exercise the gated-off paths. numpy+opencv cover the layout
      # modules, fastapi/boto3/PyJWT/python-multipart cover importing app.py
      # for the MCP endpoint tests, google-genai covers gemini_worker.
      # sqlalchemy[asyncio], not plain sqlalchemy: cloud/database.py imports
      # sqlalchemy.ext.asyncio, which needs `greenlet`, and SQLAlchemy stopped
      # installing that automatically. The failure is a COLLECTION error on
      # tests/test_account_erasure.py, and a collection error aborts the whole
      # run with exit code 2 — so CI reported "1280 items collected" and then
      # executed NONE of them, on every push, for as long as the drift lasted.
      # A red CI nobody can act on is a CI nobody reads.
      - name: Install test dependencies
        run: >
          pip install pytest pillow httpx pydantic "sqlalchemy[asyncio]" numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart
      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
