<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Map the font names offered by the subtitle UI to fonts that actually exist
  in the Docker image. Without this, libass silently falls back to DejaVu for
  every choice, so the burned captions never match the in-browser preview
  (github issue #57). Liberation fonts are metric-compatible substitutes for
  the MS core fonts; Anton is the standard open substitute for Impact.

  SCRIPT FALLBACK
  Anton, Liberation and the MS core fonts are Latin(+Cyrillic/Greek) only, so a
  Hindi, Arabic, Japanese, Korean or Chinese caption rendered in them comes out
  as tofu boxes. libass asks fontconfig for a replacement per missing glyph, so
  the fix is (a) fonts that cover those scripts in the image
  (fonts-noto-core + fonts-noto-cjk, see Dockerfile) and (b) the <default>
  rules below, which make the order deterministic instead of whatever
  fc-match happens to sort first.

  <default> APPENDS to the family list — it never overrides the chosen font —
  so Latin captions still render in Anton/Liberation exactly as before and only
  the characters those fonts do not have come from Noto. Noto Sans is listed
  before the script-specific families because its own fallback chain already
  resolves most scripts; the explicit families are there so a missing Noto Sans
  variant cannot silently drop a script.
-->
<fontconfig>
  <alias binding="strong"><family>Verdana</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Impact</family><prefer><family>Anton</family></prefer></alias>

  <!-- Script fallback for every caption font the UI can pick. -->
  <alias>
    <family>Anton</family>
    <default>
      <family>Noto Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>Liberation Sans</family>
    <default>
      <family>Noto Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>Liberation Serif</family>
    <default>
      <family>Noto Serif</family>
      <family>Noto Serif Devanagari</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif Hebrew</family>
      <family>Noto Serif Thai</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>Liberation Mono</family>
    <default>
      <family>Noto Sans Mono</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
    </default>
  </alias>
  <alias>
    <family>Noto Serif</family>
    <default>
      <family>Noto Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
</fontconfig>
