services:
  backend:
    build: .
    container_name: openshorts-backend
    # The image creates a non-root `appuser` and chowns /app to it, and then
    # this file bind-mounts the host checkout straight over that directory.
    # On Docker Desktop (Windows/macOS) ownership is synthesised and every
    # path looks writable, so the conflict is invisible. On real Linux the
    # ownership is real: /app belongs to the HOST user, appuser is a system
    # account (uid 999), and app.py dies on its second line with
    # `PermissionError: [Errno 13] Permission denied: 'uploads'` before
    # uvicorn ever imports the app — a crash loop with no obvious cause.
    #
    # Running as the host's own uid is what makes a bind mount writable.
    #
    # CHECK `id -u` BEFORE TRUSTING THE DEFAULT. 1000 is the first non-system
    # uid on a clean Ubuntu, Debian or Fedora, but an image that already
    # created its own account takes it: on an Oracle Cloud Ubuntu instance the
    # cloud agent holds 1000 and `ubuntu` is 1001. Get this wrong and the
    # container falls through to "other" on the bind mount, which can read the
    # directory but not create in it — `POST /api/process` then 500s on
    # `makedirs('output/<job-id>')` before the job exists, so there is no job
    # directory and no log to find, only "Internal Server Error" in the UI.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # useradd gave appuser HOME=/app. Overriding the uid means there is no
      # passwd entry for the process any more, so HOME would be unset and
      # ultralytics, matplotlib and fontconfig would each try to write their
      # caches to / and fail. Point it back at the writable mount.
      - HOME=/app
      # An arbitrary uid has no /etc/passwd entry either, and that breaks any
      # library that asks the system who it is. torch does exactly that while
      # being IMPORTED — `_inductor.runtime.cache_dir_utils.default_cache_dir`
      # names its cache after `getpass.getuser()` — so the job died on
      # `from ultralytics import YOLO` with
      #
      #   KeyError: 'getpwuid(): uid not found: 1001'
      #
      # getpass.getuser() reads LOGNAME/USER/LNAME/USERNAME first and only
      # falls back to pwd, so naming the process here fixes it for every such
      # library at once rather than chasing each one's cache-path setting.
      - USER=openshorts
      - LOGNAME=openshorts
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
